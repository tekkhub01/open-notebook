[project]
name = "open-notebook-mcp"
version = "0.1.0"
description = "MCP server exposing Open Notebook chat-rag and search as tools for lobe-chat / other MCP clients."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py"]
