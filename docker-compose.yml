services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    # Credentials default to root:root for a zero-config local setup. Before
    # exposing this instance to a network, set SURREAL_USER / SURREAL_PASSWORD
    # in a .env file (see .env.example) — they are applied here and to the
    # open_notebook service below, so the two always stay in sync.
    # List (exec) form so each interpolated value stays a single argument —
    # a password containing spaces would otherwise be split into several.
    command: ["start", "--log", "info", "--user", "${SURREAL_USER:-root}", "--pass", "${SURREAL_PASSWORD:-root}", "rocksdb:/mydata/mydatabase.db"]
    user: root  # Required for bind mounts on Linux
    ports:
      # Bound to localhost only: the open_notebook service reaches this over
      # the internal compose network regardless, so the host port is purely
      # for local debugging (e.g. Surrealist, `surreal sql`). Exposing this
      # on 0.0.0.0 would let anyone who can reach the host connect with the
      # default root:root credentials. Reached remotely via Tailscale serve :8001.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    restart: always
    pull_policy: always

  open_notebook:
    # Built from source by `make fork-image` (two steps, see the Makefile).
    # Not a `build:` block: the MCP layer needs the fork's own base image, which
    # compose cannot build and consume within a single service.
    image: open-notebook-fork:mcp
    ports:
      - "127.0.0.1:8502:8502"  # Web UI (tailscale-only via TS serve :8502)
      - "127.0.0.1:5056:5055"  # REST API direct (tailscale-only via TS serve :5056)
      - "5057:8080"  # MCP server (Streamable HTTP, for lobe-chat — pubblico)
    environment:
      # Where the BROWSER reaches the API. Must be https: Tailscale serve
      # publishes :5056 over TLS only, and the UI is itself served over https,
      # so an http URL is both wrong and blocked as mixed content.
      - API_URL=https://brix-ia-linux.tail216abe.ts.net:5056
      # Encrypts the API keys stored in the database. Kept in .env (gitignored)
      # because this repo is public.
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${OPEN_NOTEBOOK_ENCRYPTION_KEY:?set it in .env}

      # Database connection. SURREAL_USER / SURREAL_PASSWORD default to root:root
      # for local use; override them in a .env file before exposing the instance
      # (the same values configure the surrealdb service above).
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASSWORD=${SURREAL_PASSWORD:-root}
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

      # Chunking. There is no env_file here, so .env only feeds the ${...}
      # substitution below — these two lines are what actually puts the values
      # inside the container, for both the API and the worker (same container,
      # under supervisord). Rationale and sizing live in .env next to the values.
      - OPEN_NOTEBOOK_CHUNK_SIZE=${OPEN_NOTEBOOK_CHUNK_SIZE:-2600}
      - OPEN_NOTEBOOK_CHUNK_OVERLAP=${OPEN_NOTEBOOK_CHUNK_OVERLAP:-0}

      # MCP server config (used by the embedded mcp_server process)
      - OPEN_NOTEBOOK_PASSWORD=${OPEN_NOTEBOOK_PASSWORD:-}
      - OPEN_NOTEBOOK_NOTEBOOK_ID=${MCP_DEFAULT_NOTEBOOK_ID:-}
      - OPEN_NOTEBOOK_STRATEGY_MODEL=${MCP_DEFAULT_STRATEGY_MODEL:-model:8bk5wmrp1mksgceysphg}
      - OPEN_NOTEBOOK_CHAT_MODEL=${MCP_DEFAULT_CHAT_MODEL:-model:8bk5wmrp1mksgceysphg}

      # OPTIONAL: heavy extraction runtimes, installed on first startup when
      # enabled (downloads are cached on the ./notebook_data volume, so only the
      # first boot is slow). See docs/5-CONFIGURATION/environment-reference.md.
      # - OPEN_NOTEBOOK_ENABLE_DOCLING=true    # Docling engine + OCR + image sources (large ML stack)
      # - OPEN_NOTEBOOK_ENABLE_CRAWL4AI=true   # local Crawl4AI (bundles a Chromium browser)
      # - CRAWL4AI_API_URL=http://crawl4ai:11235  # use a remote Crawl4AI server instead (no local install)

      # OPTIONAL: max concurrent background tasks the worker processes at once
      # (default 5). Set to 1 for sequential processing on single-GPU / local
      # LLM setups to avoid overloading the model with parallel requests.
      # - OPEN_NOTEBOOK_WORKER_MAX_TASKS=1
    volumes:
      # Data only. The application code used to be bind-mounted from the host
      # over a published image; that shipped the Python changes but never the
      # frontend ones, and let the image drift from the source tree. Everything
      # is baked into open-notebook-fork:mcp now — rebuild to deploy a change.
      - ./notebook_data:/app/data
    depends_on:
      - surrealdb
    restart: always

  ai_widget:
    build:
      context: ../ai-widget
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - OPEN_NOTEBOOK_ENDPOINT=http://open_notebook:5055
      - OPEN_NOTEBOOK_NOTEBOOK_ID=notebook:wcey1gczvhr6vbdxyyn5
      - OPEN_NOTEBOOK_STRATEGY_MODEL=model:8bk5wmrp1mksgceysphg
      - OPEN_NOTEBOOK_CHAT_MODEL=model:8bk5wmrp1mksgceysphg
    expose:
      - "3000"
    depends_on:
      - open_notebook
    restart: always

  macchine_widget:
    build:
      context: ../macchine-widget
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - OPEN_NOTEBOOK_ENDPOINT=http://open_notebook:5055
      - OPEN_NOTEBOOK_NOTEBOOK_ID=notebook:ui3cujj5t2ti6ykjdn1d
      # google/gemini-3.5-flash-lite. Sostituisce gemini-3-flash-preview il
      # 2026-08-06: a parità di corpus è ~3x più rapido (9s contro 28s di
      # mediana su quattro domande reali), costa meno, e non è uno slug
      # "preview" che Google può ritirare senza preavviso. Sulle prove fatte
      # copriva meglio il merito — cita meno passaggi ma centra la domanda.
      # Il vecchio record resta in DB: per tornare indietro basta rimettere
      # model:8bk5wmrp1mksgceysphg qui e ricostruire il widget.
      - OPEN_NOTEBOOK_STRATEGY_MODEL=model:qbbyj40dun21dw9oso8h
      - OPEN_NOTEBOOK_CHAT_MODEL=model:qbbyj40dun21dw9oso8h
    expose:
      - "3000"
    depends_on:
      - open_notebook
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "5055:5055" # Open-Notebook API (HTTPS)
      - "3000:3000" # AI Widget (HTTPS, LAN)
      - "5555:5555" # AI Widget (HTTPS, public via router NAT)
      - "5556:5556" # Macchine Widget (HTTPS, public via router NAT)
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - open_notebook
      - ai_widget
      - macchine_widget
    restart: always
